# ModelaFlow — Docker Compose
# Browser (Windows): http://localhost:3080

name: modelaflow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modelaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-modelaflow}
    volumes:
      - modelaflow_pg:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelaflow} -d ${POSTGRES_DB:-modelaflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-modelaflow};Username=${POSTGRES_USER:-modelaflow};Password=${POSTGRES_PASSWORD:-CHANGE_ME}
      Auth__JwtSigningKey: ${AUTH_JWT_SIGNING_KEY:-DEV_ONLY_CHANGE_ME_ModelaFlow_Auth_Signing_Key_32+}
      Auth__CookieName: mf_auth
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:3080}
      Database__ApplyMigrations: "true"
    ports:
      - "${API_PORT:-5074}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3080}
    environment:
      NODE_ENV: production
    # Sem publish direto — o browser entra pelo gateway :3080
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      # 3080 funciona no Docker Desktop Windows; 3000/8080 costumam resetar
      - "${GATEWAY_PORT:-3080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  modelaflow_pg:
