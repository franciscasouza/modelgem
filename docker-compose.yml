# ModelaFlow — stack local / publicação via Docker
# Browser: web http://localhost:3000 → API http://localhost:5074 (NEXT_PUBLIC_* é URL do host)

name: modelaflow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modelaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-modelaflow}
    volumes:
      - modelaflow_pg:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelaflow} -d ${POSTGRES_DB:-modelaflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-modelaflow};Username=${POSTGRES_USER:-modelaflow};Password=${POSTGRES_PASSWORD:-CHANGE_ME}
      Auth__JwtSigningKey: ${AUTH_JWT_SIGNING_KEY:-DEV_ONLY_CHANGE_ME_ModelaFlow_Auth_Signing_Key_32+}
      Auth__CookieName: mf_auth
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:3080,http://localhost:3000}
      Database__ApplyMigrations: "true"
    ports:
      - "${API_PORT:-5074}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        # URL que o *browser* usa para chamar a API (porta publicada no host)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5074}
    environment:
      NODE_ENV: production
    ports:
      # 3080 evita conflito comum do relay WSL/Docker na porta 3000 no Windows
      - "${WEB_PORT:-3080}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  modelaflow_pg:
